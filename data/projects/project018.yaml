overview: |
  上場企業の開示資料から生成AI（LLM）でESG関連データを抽出するWebアプリケーション（リプレイス開発を担当したシステム）について、初回リリース後の機能追加・運用改善フェーズを担当。本番運用中のシステムに対し、顧客からのフィードバック対応、抽出精度の改善、性能・安定性・セキュリティの強化を継続的に行い、約4ヶ月で8回のマイナーリリース（v1.1〜v1.8）を本番へ届けた。

  顧客との要件調整・要件定義書の改訂から、設計・実装・テスト・インフラ・運用ドキュメント作成までを1人で一貫して担当した。

details: |
  #### 抽出精度の改善（LLMに依存しないページ特定）

  - LLMが根拠情報を省略すると抽出結果の「ページ」列が空欄になる不具合が対症療法で再発していたため、ページ確定ロジックを根本から見直し
  - 候補ページと抽出テキストをn-gram重なり率・数値トークン一致で照合する決定論的なページ照合モジュールを実装（LLM非依存の純関数、単体テスト36ケース）
  - 全ページ共通の定型句・類似見出し・数値の重複などを含む敵対的なテストデータで偽陽性を検証し、閾値を調整して正例と誤検知を分離
  - LLMが返す実在しないページ番号（ハルシネーション）を、入力したページ集合と照合して除外。3経路に重複していたロジックを共通化
  - 抽出と同時にAIによる校正値を返させ、Excel出力の「校正結果」列に出力する機能を追加（OpenAI / Anthropic × 抽出方式の全スキーマに対応）
  - ページ特定スコアの9パラメータを管理画面から調整可能に（優先順位：DB > 環境変数 > 既定値、ジョブ開始時に1回だけ解決、変更は監査ログに記録）
  - temperature非対応の新モデル（推論モデル系）への対応、モデル一覧のホワイトリスト同期、エビデンスハイライトの段階的テキスト再探索による精度改善

  #### 性能・安定性の改善

  - 抽出処理がAPIのイベントループを占有しCPU 100%で全APIが応答不能になる問題に対し、抽出パイプラインをワーカーコンテナに分離
  - PostgreSQLの `FOR UPDATE SKIP LOCKED` を使ったDBポーリング型ジョブキューを実装し、heartbeatによる停止ジョブの回収・graceful shutdown・従来方式へのロールバック経路を用意
  - OOMKill対策として同時実行ジョブ数をSemaphoreで制限し、キューイング（待機ステータス）を追加。メモリ配分の根拠をキャパシティプランニングとして文書化
  - 進捗表示のセル単位への細分化（DB側のcompare-and-swapで進捗の逆行を防止）、フロントエンドのAPIタイムアウト・部分ローディング対応

  #### 業務機能の追加（顧客要望）

  - エラーとなったファイル/URLのみを選択して再実行する機能
  - ログイン中ユーザーのパスワード変更機能（ユーザー単位のレート制限・ロックアウト付き）
  - 指示ファイルのダウンロード、一括削除、フィルター、監査ログCSVの日本語化、出力ファイル名の統一、ZIP一括ダウンロードなど

  #### セキュリティ・運用

  - Web抽出のSSRF多層防御（アプリ層：名前解決後のIP検証・リダイレクト後の再検証、インフラ層：NSGのegress制御でメタデータ・プライベートアドレス宛を遮断）
  - CSPのReport-Onlyから強制モードへの移行、TLS証明書の自動更新の復旧と期限監視、認証シークレットの期限監視ワークフロー
  - Trivyによるコンテナイメージの脆弱性スキャン、GitHub ActionsのSHAピン留め、ステージング環境の夜間自動停止によるコスト削減

challenges: |
  - LLMの出力（ページ番号・根拠情報）が不安定で、ページ列の空欄や誤ったページ番号が繰り返し発生していた
  - 抽出ジョブがAPIプロセスを占有して環境全体が応答不能になり、メモリ不足によるOOMKillも発生していた
  - 本番運用中のシステムに対して、既存の利用を止めずに機能追加・構成変更を継続的にリリースする必要があった
  - 新しいLLMモデルの仕様差異（temperature非対応など）により抽出が失敗するケースがあった

approach: |
  - ページ確定をLLM任せにせず決定論的な照合に置き換え、敵対的なテストデータで閾値を決定。「誤ったページを出さない」と「空欄をなくす」のどちらを優先するかを顧客と議論し、合意した方針に実装を合わせた
  - ワーカー分離では新たなミドルウェア（Redis/Celery等）を導入せず、既存のPostgreSQLで完結させることで運用負荷を増やさない構成を選択
  - 前方・後方互換のマイグレーションと従来方式への退避経路を用意し、本番へのロールバックを安全に行えるようにした
  - 要件定義書・設計書・テスト文書を実装と同じPRで更新し、顧客の合意プロセスに乗せることで仕様と実装の乖離を防いだ
  - Claude Codeのカスタムサブエージェント（計画・実装・レビュー）を整備し、1人体制でも設計・実装・レビューの品質を保てる開発フローを構築

results: |
  - 約4ヶ月で8回のマイナーリリース（v1.1〜v1.8）を本番に適用し、初回リリース直後には顧客からのフィードバック12件を解消
  - ワーカー分離により、抽出処理の実行中もAPIが応答不能にならない構成を実現
  - 決定論的なページ照合により、LLMの出力ゆらぎに起因するページ列の空欄・誤りの再発を解消
  - テストコードを約18,000行追加（単体・結合・E2E）し、継続的な機能追加でも品質を担保できる状態を構築

tech_summary: |
  - **プログラミング言語**: Python 3.12, TypeScript
  - **フレームワーク**: FastAPI, React, Vite
  - **DB/ORM**: PostgreSQL（SKIP LOCKEDによるジョブキュー）, SQLAlchemy 2.0（async）, Alembic
  - **LLM**: Anthropic Claude API, OpenAI API
  - **PDF/データ処理**: PyMuPDF, Playwright, tenacity
  - **インフラ**: Azure（VM, NSG, Entra ID）, Terraform, Docker Compose, nginx, Let's Encrypt
  - **セキュリティ**: Trivy, Dependabot
  - **CI/CD**: GitHub Actions
  - **開発支援**: Claude Code（カスタムサブエージェント）
  - **バージョン管理**: Git（GitHub）
