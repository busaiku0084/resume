career_vision: |
  **技術でプロダクト開発をリードできるエンジニアになる**

  テックリードとして、設計・実装・デリバリーまで一貫したリーダーシップを発揮したいと考えています。単にコードを書くだけでなく、技術選定やアーキテクチャの意思決定を通じて、プロダクトの成長とユーザー価値の最大化に貢献したいです。

  **スケーラブルなシステム設計に強みを持つエンジニアになる**

  大規模システムの設計・運用を通じて、負荷分散・パフォーマンスチューニングのスキルをさらに磨きたいと考えています。キャッシュ戦略・非同期処理・データベース最適化を駆使し、高トラフィックに耐えうるシステムを設計・構築できるエンジニアを目指します。

  **AI時代における開発プロセスの変革を推進する**

  生成AIを活用した開発生産性の向上や、AI機能をプロダクトに組み込むための設計・実装を実践し、AI時代のエンジニアリングをリードしたいと考えています。現職でAI受託開発に携わる中で、AIとソフトウェアエンジニアリングの融合領域に大きな可能性を感じています。

  **チームで成果を最大化できるエンジニアになる**

  メンバーの技術的成長を支援し、コードレビューや設計議論を通じてチーム全体のスキルを底上げしたいです。強い開発チームを作り、継続的に高品質な成果を出せる環境を整えることが目標です。

generative_ai: |
  **開発業務での活用**

  - Claude Code・GitHub Copilotを日常的に活用し、コーディング・リファクタリング・テスト作成の生産性を向上
  - 設計段階でのアーキテクチャ検討やトレードオフ分析にLLMを活用
  - ドキュメント作成・コミットメッセージ・PR本文の作成補助に利用
  - YAMLデータ駆動のビルドシステム構築など、生成AIと協働した開発フローを実践

  **AI受託開発での実務経験**

  - 現職（AICE株式会社）にてAI関連の受託開発に従事
  - LLMを活用したアプリケーション設計・実装の知見を蓄積中

  **学習・キャッチアップ**

  - 新しいモデルやツールのリリースに合わせて継続的にキャッチアップ
  - プロンプトエンジニアリングの手法を日常業務で実践・改善

management: |
  前職（株式会社MPX）にて小規模チーム（3〜4名）のリーダーを務めました。

  **担当したマネジメント業務**

  - チームメンバーへのタスク割り当て・進捗管理（issueベースでの具体的なタスク設計）
  - ビジネスサイド・他システムチームとのコミュニケーション窓口
  - 週次での進捗確認とリスクの早期検知

  **成果目標**

  - プロジェクトのスケジュール通りの進行と品質の高い成果物の納品
  - チームメンバーがスムーズに作業できる環境の整備
  - ビジネスサイドや他チームとの連携を円滑に保つこと

  **直面した課題と工夫**

  - **スケジュール管理**: 週次で進捗を確認し、遅延リスクがある場合は優先順位の見直しとリソース再配分を早期に実施。重要タスクが滞らない体制を維持した
  - **メンバーのスキル把握**: 定期的な1on1を通じて各メンバーの得意・苦手領域を把握。適切なタスクアサインにより、個々の成長とプロジェクト進行を両立させた
  - **ボトルネックへの対応**: タスクが停滞した際は自ら巻き取って解決する一方、根本原因を特定してチーム全体のスキル底上げを図り、属人化を防止した
  - **コミュニケーション設計**: 定期ミーティングの設定と明確な情報共有ルールの策定により、ビジネスサイドとの認識齟齬を最小化した

what_i_want_to_do: |
  - AIを活用したプロダクト開発・サービス設計に携わりたい
  - バックエンド・インフラの強みを活かしつつ、プロダクト全体を俯瞰した開発をしたい
  - 技術的な意思決定に関わり、アーキテクチャの設計・選定をリードしたい
  - スケーラブルなシステムの設計・構築に挑戦したい
  - 開発チームの生産性向上や技術文化の醸成に貢献したい

desired_skills: |
  - **LLM/AIエンジニアリング**: LLMを活用したアプリケーション設計、RAG、エージェント構築
  - **大規模分散システム**: メッセージキュー、イベント駆動アーキテクチャ、マイクロサービス設計
  - **パフォーマンスエンジニアリング**: 高トラフィック対応、キャッシュ戦略、データベースチューニング
  - **Platform Engineering**: 開発者体験（DX）の向上、CI/CDの高度化、IaCの実践深化
  - **Kubernetes**: コンテナオーケストレーション、ECSからの発展的なスキル拡張

extracurricular: |
  - 副業として採用管理システム（ATS）のバックエンド開発に従事（2025年7月〜）
  - 個人開発を通じた技術キャッチアップ（Go、Next.js等）

optimal_environment: |
  - 技術的な裁量があり、設計やアーキテクチャの議論ができる環境
  - コードレビューやペアプログラミングなど、チームで学び合う文化がある環境
  - 新しい技術やツールの導入に前向きで、改善提案が歓迎される環境
  - リモートワークを含む柔軟な働き方ができる環境
  - プロダクトの成長に直接貢献できる実感が持てる環境

strengths: |
  **技術的スキル**

  - **問題解決能力**: 問題の根本原因を迅速に特定し、効果的な解決策を導く力。レガシーシステムのリプレイスやパフォーマンス改善など、複雑な技術課題に対して一貫して成果を出してきた
  - **幅広い技術対応力**: バックエンド開発からインフラ構築、CI/CD整備まで一貫して対応できる守備範囲の広さ

  **プロジェクト管理能力**

  - **タスク設計・管理**: issueベースでの具体的なタスク設計と、チーム全体の進捗を見通した優先順位付けができる
  - **計画力**: 現実的かつ効率的なスケジュールを策定し、リスクを織り込んだ計画でプロジェクトを完遂する力

  **コミュニケーション**

  - **橋渡し役**: ビジネスサイドと開発チームの間に立ち、技術的な制約を分かりやすく伝え、合意形成を円滑に進められる
