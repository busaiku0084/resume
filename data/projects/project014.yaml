overview: |
  採用管理システム（ATS）において、これまで応募者と企業間のやり取りはすべてメールで行われていたが、やり取りの遅延や履歴の分散が課題となっていた。この課題を解決するため、応募者と企業が直接コミュニケーションできるチャット機能を新規追加した。

  チャット機能は、リアルタイム性と操作性を重視し、非同期通信（AJAX）によるメッセージ送受信、既読管理、ファイルアップロード、通知メール送信（非同期処理）などを実装。また、この開発を機にCakePHPのバージョンを3系から5系へアップグレードし、レガシー化していた構成をモダンな設計へ刷新した。
details: |
  #### チャット機能の新規追加

  - 応募者と企業の1対1チャット機能を実装（応募単位でスレッド管理）
  - AJAXを用いた非同期メッセージ送受信
  - メッセージの既読・未読ステータス管理
  - ファイル送信（PDF・画像など）機能を追加、S3へ保存
  - メッセージ送信時のメール通知（非同期処理）を実装し、応募者・企業双方に通知

  #### CakePHPのバージョンアップ（3 → 5）

  - コントローラ層・モデル層の命名規則やORMの互換性対応
  - バリデーションやFormクラス周りのリファクタ
  - テンプレートエンジンを最新仕様に合わせて更新（Twig化含む）
  - PHPUnitテストの修正・再構築による自動テスト整備

  #### PdMとの連携

  - PdM主導のUI要件をもとに仕様を整理し、要件定義・設計段階から伴走
  - フロント担当とAPI仕様を共有し、エンドポイントの責務を明確化
  - 週次で進捗確認・課題共有を実施し、開発優先度を調整
challenges: |
  - メール通知の非同期化（キュー処理）により、送信順序や重複送信の制御が複雑化
  - CakePHP 3→5系の移行に伴う非互換エラーが多数発生し、ORMやルーティング構成の再設計が必要
  - 既読管理やファイル送信処理の整合性テストに時間を要した
approach: |
  - メール通知をAWS SQS経由の非同期ジョブとして処理し、送信処理の安定化を実現
  - S3アップロード処理を共通サービス化し、再利用性と保守性を向上
  - JS側ではイベント駆動設計を採用し、メッセージ送信・既読更新をスムーズに反映
  - 移行作業ではテストコードの先行整備により、バージョンアップ後の不具合を最小化
results: |
  - チャット利用率が導入後3ヶ月で応募者の約80%に達し、メール問い合わせ件数を大幅削減
  - メール非同期処理により、平均送信時間を約60%短縮
  - CakePHP 5対応により、将来的なメンテナンスコストを軽減し、最新PHPバージョンでの安定稼働を実現
tech_summary: |
  - **プログラミング言語**: PHP, JavaScript
  - **フレームワーク**: CakePHP 5
  - **インフラ**: AWS（EC2, S3, Aurora MySQL, SQS）
  - **データベース**: Amazon Aurora (MySQL互換)
  - **バージョン管理**: Git（Bitbucket）
  - **プロジェクト管理**: Backlog
  - **テスト**: PHPUnit
  - **その他**: AJAX, JSON API
