overview: |
  メールコンテンツ作成システム（ビジュアルメールエディタ）に、従来の既存CMS経由に加えて、新しい認証基盤（IdP）経由のユーザーを受け入れられるようにするプロジェクト。フロントエンドリプレイスに続くPhase 2として、複数の流入経路からの利用を前提としたデータ設計・外部連携の方針策定から実装までを担当した。

  3つのシステム（自システム・既存CMS・認証基盤）が絡み、それぞれ開発主体も異なるため、まずシステム間のデータの境界・責務・連携の向きを定義する基本設計を主導。設計方針資料を作成してキックオフで関係者の合意を取った上で、開発を進めた。

details: |
  #### システム間連携のデータ設計（基本方針の策定）

  - 「契約（容量プール）」と「サービス（データの持ち主）」の2階建ての内部ID設計により、外部システムの識別子に直接依存しない構成を定義
  - プラン・権限などの状態は認証基盤を原本（Source of Truth）とし、認証トークン（JWT）に同梱された値と都度取得する上限値で判断する方式に整理。自システム側にコピーを持たない
  - API疎通の向きを一方向（自システム→認証基盤）に統一し、双方向のハードコードな相互参照を排除
  - 事前の連携処理は行わず、内部IDを持たない顧客が認証・利用した時点で動的に作成する冪等な設計に
  - 解約検知→配下データの非同期削除、既存データ移行（内部IDの払い出し・初期使用量の集計）などのユースケースを整理

  #### アセット使用量の計測・上限制御

  - 画像などのアセット使用量を契約単位で計測し、認証基盤へ通知する仕組みを設計・実装
  - 上限超過時の保存・アップロード制限、プランに応じた機能の出し分けに対応

  #### 機能開発・リファクタリング

  - 要素のコピー&ペースト、HTMLメールのエクスポート・インポートなどエディタ機能を追加
  - バックエンド（PHP）処理のリファクタリング
  - 認証基盤の呼び出しはmockで切り離し、単体でも動作する構成で段階的に連携できるようにした

challenges: |
  - 3つのシステムの開発主体がそれぞれ異なる中で、データの境界・責務・連携の向きについて関係者間の認識が揃っておらず、このまま進めると手戻りが大きくなるリスクがあった
  - 認証基盤側の開発と並行して進むため、相手側のAPI仕様が固まる前に自システム側の設計・実装を進める必要があった
  - 副業（業務委託）として限られた稼働時間の中で、設計リードと実装を両立する必要があった

approach: |
  - APIやトークンの詳細仕様に入る前に、「誰が原本で、どちら向きに受け渡すか」に絞った基本方針資料を作成し、キックオフで関係者の合意を取ってから詳細設計・実装に進めた
  - トークン同梱・都度取得・一方向通知という外部依存を最小化する設計により、認証基盤側の進捗に左右されずに開発を進められるようにした
  - 連携部分をmock化して単体利用を優先するスコープ設計とし、段階的なリリースを可能にした
  - 限られた稼働時間でも進捗が止まらないよう、設計判断やコンテキストをドキュメントに残し、非同期コミュニケーションを前提とした進め方を徹底した

results: |
  - システム間のデータ設計方針を関係者間で合意し、大きな手戻りなく実装フェーズへ移行
  - 予定通り実装を完了し、内部テスト・UATを経て本番適用の準備まで完了。認証基盤との繋ぎ込みフェーズへ移行した
  - 外部識別子に依存しない内部ID設計により、今後の提供チャネル追加にも対応できる拡張性を確保

tech_summary: |
  - **プログラミング言語**: TypeScript, PHP
  - **フレームワーク**: React, Vite
  - **認証・連携**: JWT（認証トークン）, REST API
  - **インフラ**: AWS
  - **CI/CD**: GitHub Actions
  - **バージョン管理**: Git（GitHub）
